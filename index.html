<!-- No @font-face here on purpose. The zip is the whole entry, so nothing
     outside it is fetched at boot: the emoji come from the platform font
     until the player takes the offer at the head of the home screen, and
     dom.js writes the @font-face into the head only then. debug.js puts the local copy (npm
     run font, gitignored) in front of the hosted url for dev. -->
<link rel=stylesheet href=code/style.css>
</head><body>

<!-- no markup: the phone's divs are written by domInit at boot, so the built
     page can be nothing but the script - dom.js is the one source of truth -->
